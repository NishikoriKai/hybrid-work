<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行銷企劃部｜混合辦公管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede8;
  --text:#1a1a18;--text2:#6b6b68;--text3:#9a9a96;
  --border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.18);
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#0F6E56;
  --amber:#EF9F27;--amber-bg:#FAEEDA;--amber-text:#854F0B;
  --red:#E24B4A;--red-bg:#FCEBEB;--red-text:#A32D2D;
  --purple:#534AB7;--purple-bg:#EEEDFE;--purple-text:#3C3489;
  --teal:#1D9E75;--teal-bg:#E1F5EE;--teal-text:#0F6E56;
  --pink-bg:#FBEAF0;--pink-text:#72243E;
  --r:8px;--rl:12px;--shadow:0 1px 4px rgba(0,0,0,.08)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#242422;--bg3:#2c2c2a;
  --text:#f0efe8;--text2:#9a9a96;--text3:#6b6b68;
  --border:rgba(255,255,255,.10);--border2:rgba(255,255,255,.18);
  --blue-bg:#0c2240;--blue-text:#85B7EB;
  --green-bg:#0a2a1e;--green-text:#5DCAA5;
  --amber-bg:#2a1e06;--amber-text:#FAC775;
  --red-bg:#2a0e0e;--red-text:#F09595;
  --purple-bg:#1a1830;--purple-text:#AFA9EC;
  --pink-bg:#2a1020;--pink-text:#F4C0D1
}}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg3);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}
.app{max-width:980px;margin:0 auto;padding:0 1rem 4rem}
.header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0 1.5rem;border-bottom:.5px solid var(--border);margin-bottom:1.5rem}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;background:#1a5fd6;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:20px;height:20px;fill:white}
.app-title{font-size:17px;font-weight:600}
.app-sub{font-size:12px;color:var(--text3);margin-top:1px}
.dept-badge{font-size:12px;background:var(--blue-bg);color:var(--blue-text);padding:4px 10px;border-radius:99px}
.db-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.db-dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.db-dot.ok{background:var(--green)}.db-dot.err{background:var(--red)}
/* Tabs */
.tab-bar{display:flex;gap:3px;background:var(--bg2);border-radius:var(--r);padding:4px;margin-bottom:1.5rem;border:.5px solid var(--border)}
.tab{flex:1;padding:7px 6px;border:none;background:transparent;border-radius:6px;font-size:12px;font-weight:400;cursor:pointer;color:var(--text2);transition:all .15s;white-space:nowrap;text-align:center}
.tab.active{background:var(--bg);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.panel{display:none}.panel.active{display:block}
/* Cards */
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:1.25rem 1.5rem}
.rule-box{background:var(--bg2);border-radius:var(--r);padding:.85rem 1rem;margin-bottom:1.25rem;font-size:12px;color:var(--text2);line-height:1.8;border:.5px solid var(--border)}
.rule-box strong{color:var(--text);font-weight:600}
/* Form */
.apply-layout{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;align-items:start}
@media(max-width:640px){.apply-layout{grid-template-columns:1fr}}
.form-row{margin-bottom:1rem}
.field-label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
select,input[type=date],input[type=text],textarea{width:100%;padding:9px 11px;border:.5px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;font-family:inherit}
select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
textarea{resize:vertical;min-height:70px}
.seg-control{display:flex;gap:5px}
.seg-btn{flex:1;padding:8px 4px;border:.5px solid var(--border2);background:transparent;border-radius:var(--r);font-size:13px;cursor:pointer;color:var(--text2);text-align:center;transition:all .12s}
.seg-btn:hover{background:var(--bg2)}
.seg-btn.sel{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
/* Type selector */
.type-selector{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.type-card{border:.5px solid var(--border2);border-radius:var(--r);padding:12px;cursor:pointer;transition:all .15s;text-align:center}
.type-card:hover{background:var(--bg2)}
.type-card.sel-wfh{border-color:var(--blue);background:var(--blue-bg)}
.type-card.sel-leave{border-color:var(--purple);background:var(--purple-bg)}
.type-icon{font-size:22px;margin-bottom:4px}
.type-label{font-size:13px;font-weight:600}
.type-sub{font-size:11px;color:var(--text3);margin-top:2px}
.type-card.sel-wfh .type-label{color:var(--blue-text)}
.type-card.sel-leave .type-label{color:var(--purple-text)}
/* Submit */
.submit-btn{width:100%;padding:10px;background:var(--blue);color:white;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;margin-top:.75rem;transition:background .15s}
.submit-btn:hover:not(:disabled){background:var(--blue-text)}
.submit-btn:disabled{background:var(--bg3);color:var(--text3);cursor:not-allowed;border:.5px solid var(--border)}
/* Quota card */
.quota-idle{text-align:center;padding:2.5rem 1rem;color:var(--text3);font-size:13px;line-height:2}
.quota-idle .qi-icon{font-size:30px;margin-bottom:8px}
.quota-date-label{font-size:13px;color:var(--text2);margin-bottom:14px;font-weight:500}
.quota-big{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.quota-num{font-size:42px;font-weight:700;line-height:1}
.quota-unit{font-size:14px;color:var(--text2)}
.quota-sub{font-size:12px;color:var(--text3);margin-bottom:14px}
.meter-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.meter-bar{flex:1;height:7px;background:var(--bg3);border-radius:99px;overflow:hidden}
.meter-fill{height:100%;border-radius:99px;transition:width .4s ease}
.meter-label{font-size:12px;font-weight:600;white-space:nowrap}
.quota-note{border-radius:7px;padding:8px 12px;font-size:12px;margin-top:8px}
.quota-ok{background:var(--green-bg);color:var(--green-text)}
.quota-warn{background:var(--amber-bg);color:var(--amber-text)}
.quota-full{background:var(--red-bg);color:var(--red-text)}
.quota-na{background:var(--bg2);color:var(--text3)}
.quota-holiday{background:var(--pink-bg);color:var(--pink-text)}
.quota-divider{border:none;border-top:.5px solid var(--border);margin:12px 0}
.pill-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{display:flex;align-items:center;gap:4px;padding:3px 8px 3px 4px;border-radius:99px;font-size:12px}
.pill-av{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.pill-approved{background:var(--green-bg);color:var(--green-text)}
.pill-pending{background:var(--amber-bg);color:var(--amber-text)}
.pill-leave{background:var(--purple-bg);color:var(--purple-text)}
.mini-label{font-size:11px;color:var(--text3);margin-top:10px;margin-bottom:4px;font-weight:500}
/* Calendar */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav-btn{border:.5px solid var(--border2);background:var(--bg);width:32px;height:32px;border-radius:var(--r);cursor:pointer;font-size:15px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:background .12s}
.cal-nav-btn:hover{background:var(--bg2)}
.cal-month-title{font-size:16px;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-table{width:100%;border-collapse:collapse;border:.5px solid var(--border);border-radius:var(--rl);overflow:hidden;table-layout:fixed}.cal-table th{background:var(--bg2);padding:8px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--text2);border:.5px solid var(--border)}.cal-table td{border:.5px solid var(--border);vertical-align:top;padding:0;width:14.28%}
/* cal-head now uses .cal-table th */
.cal-cell{background:var(--bg);min-height:90px;padding:6px;cursor:pointer;transition:background .1s;display:block}
.cal-cell:hover{background:var(--bg2)}
.cal-cell.other{opacity:.3;pointer-events:none}
.cal-cell.today{background:var(--blue-bg)}
.cal-cell.today .day-n{color:var(--blue)}
.cal-cell.wknd,.cal-cell.wknd:hover{opacity:.35;cursor:default;pointer-events:none}
.cal-cell.holiday-cell{background:var(--pink-bg)}
.cal-cell.mon-cell{background:#fffbf0}
@media(prefers-color-scheme:dark){.cal-cell.mon-cell{background:#1e1a06}.cal-cell.holiday-cell{background:#2a1020}}
.cal-cell.selected{outline:2px solid var(--blue);outline-offset:-2px}
.day-n{font-size:13px;font-weight:600;margin-bottom:3px}
.no-wfh-tag{font-size:9px;background:var(--red-bg);color:var(--red-text);border-radius:3px;padding:0 4px;display:inline-block;margin-bottom:2px}
.holiday-tag{font-size:9px;background:var(--pink-bg);color:var(--pink-text);border-radius:3px;padding:0 4px;display:inline-block;margin-bottom:2px}
.chip{font-size:10px;padding:1px 5px;border-radius:3px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-approved{background:var(--green-bg);color:var(--green-text)}
.chip-pending{background:var(--amber-bg);color:var(--amber-text)}
.chip-rejected{background:var(--red-bg);color:var(--red-text)}
.chip-leave{background:var(--purple-bg);color:var(--purple-text)}
.more-hint{font-size:10px;color:var(--text3)}
/* Day detail */
.day-detail-card{margin-top:1rem}
.detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.detail-title{font-size:15px;font-weight:600}
.detail-quota{font-size:12px;color:var(--text2)}
.app-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:.5px solid var(--border)}
.app-row:last-child{border-bottom:none}
.app-info{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.app-name{font-size:14px;font-weight:500}
.app-meta{font-size:12px;color:var(--text2)}
.app-reject-reason{font-size:11px;color:var(--red-text);margin-top:2px;font-style:italic}
.act-btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.btn-approve{border:.5px solid var(--green);background:transparent;color:var(--green-text);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:500}
.btn-approve:hover{background:var(--green-bg)}
.btn-reject-open{border:.5px solid var(--red);background:transparent;color:var(--red-text);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:500}
.btn-reject-open:hover{background:var(--red-bg)}
.btn-edit-app{border:.5px solid var(--border2);background:transparent;color:var(--text2);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.btn-edit-app:hover{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue)}
.btn-cancel-app{border:.5px solid var(--border2);background:transparent;color:var(--text2);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.btn-cancel-app:hover{background:var(--red-bg);color:var(--red-text);border-color:var(--red)}
.status-pill{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:500}
.empty-hint{text-align:center;color:var(--text3);font-size:13px;padding:2rem}
/* Members */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--bg2);border-radius:var(--r);padding:1rem;text-align:center;border:.5px solid var(--border)}
.stat-num{font-size:26px;font-weight:700}
.stat-lbl{font-size:12px;color:var(--text3);margin-top:2px}
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:1.5rem}
.member-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:14px;display:flex;align-items:center;gap:10px;position:relative}
.member-card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.mc-btn{width:22px;height:22px;border:none;background:transparent;cursor:pointer;color:var(--text3);font-size:14px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .1s}
.mc-btn:hover{background:var(--bg2)}
.mc-btn.edit-btn:hover{color:var(--blue-text)}
.mc-btn.del-btn:hover{color:var(--red-text)}
.m-name{font-size:14px;font-weight:600}
.m-role{font-size:12px;color:var(--text2)}
.add-form{background:var(--bg2);border-radius:var(--rl);padding:1rem 1.25rem;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;border:.5px solid var(--border)}
.add-form .fg{flex:1;min-width:130px}
.add-form input{width:100%;padding:8px 10px;border:.5px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--bg);color:var(--text)}
.add-btn{padding:8px 16px;background:var(--blue);color:white;border:none;border-radius:var(--r);font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap}
.add-btn:hover{background:var(--blue-text)}
.sec-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
/* Log */
.log-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.log-toolbar select,.log-toolbar input[type=text]{padding:7px 10px;font-size:13px}
.log-toolbar select{width:auto}
.log-toolbar input[type=text]{flex:1;min-width:120px}
.log-btn{padding:7px 13px;border-radius:var(--r);font-size:12px;cursor:pointer;font-weight:500}
.log-export{border:.5px solid var(--border2);background:transparent;color:var(--text2)}
.log-export:hover{background:var(--bg2)}
.log-clear{border:.5px solid var(--red);background:transparent;color:var(--red-text)}
.log-clear:hover{background:var(--red-bg)}
.log-count{font-size:12px;color:var(--text3);margin-bottom:8px}
.log-wrap{border:.5px solid var(--border);border-radius:var(--rl);overflow:hidden;overflow-x:auto}
.log-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.log-table th{background:var(--bg2);padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);border-bottom:.5px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.log-table td{padding:9px 12px;border-bottom:.5px solid var(--border);color:var(--text);vertical-align:middle}
.log-table tr:last-child td{border-bottom:none}
.log-table tr:hover td{background:var(--bg2)}
.log-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.lb-apply{background:var(--blue-bg);color:var(--blue-text)}
.lb-leave{background:var(--purple-bg);color:var(--purple-text)}
.lb-approve{background:var(--green-bg);color:var(--green-text)}
.lb-reject{background:var(--red-bg);color:var(--red-text)}
.lb-cancel{background:var(--bg3);color:var(--text2)}
.lb-edit{background:var(--amber-bg);color:var(--amber-text)}
.lb-madd{background:var(--purple-bg);color:var(--purple-text)}
.lb-mdel{background:var(--amber-bg);color:var(--amber-text)}
.lb-medit{background:var(--blue-bg);color:var(--blue-text)}
.log-new{animation:logflash 1.6s ease}
@keyframes logflash{0%{background:var(--blue-bg)}100%{background:transparent}}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--bg);border-radius:var(--rl);padding:1.5rem;width:100%;max-width:440px;border:.5px solid var(--border2);box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:1.25rem}
.modal-footer{display:flex;gap:8px;margin-top:1.25rem;justify-content:flex-end}
.btn-cancel-modal{padding:8px 16px;border:.5px solid var(--border2);background:transparent;border-radius:var(--r);font-size:13px;cursor:pointer;color:var(--text2)}
.btn-cancel-modal:hover{background:var(--bg2)}
.btn-save-modal{padding:8px 16px;background:var(--blue);color:white;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer}
.btn-save-modal:hover{background:var(--blue-text)}
.btn-danger-modal{padding:8px 16px;border:.5px solid var(--red);background:transparent;color:var(--red-text);border-radius:var(--r);font-size:13px;cursor:pointer;margin-right:auto}
.btn-danger-modal:hover{background:var(--red-bg)}
.btn-red-modal{padding:8px 16px;background:var(--red);color:white;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer}
.btn-red-modal:hover{opacity:.88}
/* Loading */
.loading-overlay{position:fixed;inset:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:12px}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text3)}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#f0efe8;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;z-index:9999;display:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.err{background:var(--red);color:white}
.toast.show{display:block;animation:fadeup .2s ease}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">連線中...</div>
</div>

<div id="main-app" style="display:none">
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div>
      <div><div class="app-sub">鉅亨買基金</div><div class="app-title">混合辦公管理</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="db-status"><div class="db-dot ok" id="db-dot"></div><span id="db-label">已連線</span></div>
      <div class="dept-badge">行銷企劃部</div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('apply')">✏️ 申請</button>
    <button class="tab" onclick="switchTab('calendar')">📅 月曆</button>
    <button class="tab" onclick="switchTab('members')">👥 成員</button>
    <button class="tab" onclick="switchTab('log')">🗂 操作記錄</button>
  </div>

  <!-- APPLY -->
  <div id="tab-apply" class="panel active">
    <div class="rule-box"><strong>申請規則：</strong>居家辦公每週至多 <strong>1 日</strong>（半日起）・每日居家上限總人數 <strong>1/2</strong>・週一及國定假日不適用・當週有請假（公假除外）者不得申請居家辦公</div>
    <div class="apply-layout">
      <div class="card">
        <div class="form-row">
          <label class="field-label">申請人</label>
          <select id="apply-member"></select>
        </div>
        <div class="form-row">
          <label class="field-label">申請類型</label>
          <div class="type-selector">

// ── DB ───────────────────────────────────────────────────
async function dbFetch(table,opts={}) {
  let q=supabase_client.from(table).select('*');
  if(opts.order) q=q.order(opts.order,{ascending:opts.asc??true});
  const {data,error}=await q; if(error) throw error; return data;
}
async function dbInsert(table,row) {
  const {data,error}=await supabase_client.from(table).insert(row).select().single();
  if(error) throw error; return data;
}
async function dbUpdate(table,id,patch) {
  const {error}=await supabase_client.from(table).update(patch).eq('id',id);
  if(error) throw error;
}
async function dbDelete(table,id) {
  const {error}=await supabase_client.from(table).delete().eq('id',id);
  if(error) throw error;
}
async function addLog(actor,action,target='',date='',slot='',note='') {
  const row={ts:nowStr(),actor,action,target,date,slot,note};
  const saved=await dbInsert('logs',row); logs.unshift(saved);
}

// ── Quota card ───────────────────────────────────────────
function renderQuota(date) {
  const idle=document.getElementById('quota-idle');
  const det=document.getElementById('quota-detail');
  if(!date){idle.style.display='';det.style.display='none';return;}
  idle.style.display='none';det.style.display='';
  const d=new Date(date+'T00:00:00');
  const wdN=['日','一','二','三','四','五','六'];
  const label=`${d.getMonth()+1} 月 ${d.getDate()} 日（週${wdN[d.getDay()]}）`;
  const half=Math.floor(members.length/2);
  const approvedList=applications.filter(a=>a.date===date&&a.status==='approved'&&a.type==='wfh');
  const pendingList=applications.filter(a=>a.date===date&&a.status==='pending'&&a.type==='wfh');
  const leaveList=applications.filter(a=>a.status!=='rejected'&&a.type==='leave'&&a.date<=date&&(a.date_end||a.date)>=date);
  const used=approvedList.length, rem=Math.max(0,half-used);
  const pct=half>0?Math.min(100,Math.round(used/half*100)):0;
  const mColor=pct>=100?'var(--red)':pct>=60?'var(--amber)':'var(--green)';
  let h=`<div class="quota-date-label">${label}</div>`;
  if(isWeekend(date)){h+=`<div class="quota-note quota-na">週末無法申請</div>`;det.innerHTML=h;resetBtn();return;}
  if(isHoliday(date)){h+=`<div class="quota-note quota-holiday">國定假日（${holidayName(date)}）</div>`;det.innerHTML=h;resetBtn(true,'國定假日不適用');return;}
  if(isMonday(date)){h+=`<div class="quota-note quota-na">週一不適用居家辦公</div>`;det.innerHTML=h;resetBtn(true,'週一不適用');return;}
  if(isPostHoliday(date)){h+=`<div class="quota-note quota-na">連假後第一個工作日，不適用居家辦公</div>`;det.innerHTML=h;resetBtn(true,'連假後不適用');return;}
  h+=`<div class="quota-big"><span class="quota-num" style="color:${rem===0?'var(--red)':rem<=1?'var(--amber)':'var(--green)'}">${rem}</span><span class="quota-unit">/ ${half} 個名額剩餘</span></div>
  <div class="quota-sub">部門 ${members.length} 人・當日上限 ${half} 人</div>
  <div class="meter-wrap"><div class="meter-bar"><div class="meter-fill" style="width:${pct}%;background:${mColor}"></div></div><div class="meter-label" style="color:${mColor}">${used}/${half}</div></div>`;
  h+=rem===0?`<div class="quota-note quota-full">當日名額已滿</div>`:rem===1?`<div class="quota-note quota-warn">僅剩最後 1 個名額</div>`:`<div class="quota-note quota-ok">名額充足，可正常申請</div>`;
  if(approvedList.length||pendingList.length||leaveList.length){
    h+=`<hr class="quota-divider">`;
    if(approvedList.length){h+=`<div class="mini-label">居家辦公-已核准（${approvedList.length}人）</div><div class="pill-row">`;approvedList.forEach(a=>{const m=getMember(a.member_id);if(!m)return;const av=getAv(m.id);h+=`<div class="pill pill-approved"><div class="pill-av" style="background:${av.bg};color:${av.c}">${initials(m.name)}</div>${m.name}</div>`;});h+=`</div>`;}
    if(pendingList.length){h+=`<div class="mini-label">居家辦公-待審核（${pendingList.length}人）</div><div class="pill-row">`;pendingList.forEach(a=>{const m=getMember(a.member_id);if(!m)return;const av=getAv(m.id);h+=`<div class="pill pill-pending"><div class="pill-av" style="background:${av.bg};color:${av.c}">${initials(m.name)}</div>${m.name}</div>`;});h+=`</div>`;}
    if(leaveList.length){h+=`<div class="mini-label">休假（${leaveList.length}人）</div><div class="pill-row">`;leaveList.forEach(a=>{const m=getMember(a.member_id);if(!m)return;const av=getAv(m.id);h+=`<div class="pill pill-leave"><div class="pill-av" style="background:${av.bg};color:${av.c}">${initials(m.name)}</div>${m.name}(${a.slot||''})</div>`;});h+=`</div>`;}
  }
  det.innerHTML=h;
  const btn=document.getElementById('submit-btn');
  btn.disabled=rem===0;btn.textContent=rem===0?'當日名額已滿':'送出申請';
}
function resetBtn(disable=false,text='送出申請'){
  const b=document.getElementById('submit-btn');b.disabled=disable;b.textContent=text;
}

// ── Submit ───────────────────────────────────────────────
async function submitApply() {
  const memberId=parseInt(document.getElementById('apply-member').value);
  const note=document.getElementById('apply-note').value.trim();
  const m=getMember(memberId);
  if(!m){showToast('請選擇申請人',true);return;}

  if(applyType==='leave') {
    const start=document.getElementById('leave-start').value;
    const end=document.getElementById('leave-end').value;
    const lt=document.getElementById('leave-type').value;
    if(!start||!end){showToast('請選擇起訖日期',true);return;}
    if(end<start){showToast('結束日期不可早於開始日期',true);return;}
    document.getElementById('submit-btn').disabled=true;
    try {
      const saved=await dbInsert('applications',{member_id:memberId,date:start,date_end:end,slot:lt,status:'approved',type:'leave',note});
      applications.push(saved);
      await addLog(m.name,'leave_apply',m.name,`${start}～${end}`,lt,note);
      showToast(`${lt}申請已送出 ✓`);
      document.getElementById('leave-start').value='';
      document.getElementById('leave-end').value='';
      document.getElementById('apply-note').value='';
      resetBtn();
    } catch(e){showToast('送出失敗',true);resetBtn();}
    return;
  }

  // WFH
  const date=document.getElementById('apply-date').value;
  if(!date){showToast('請選擇日期',true);return;}
  const d=new Date(date+'T00:00:00'),day=d.getDay();
  if((day===0||day===6)&&!isMakeupDay(date)){showToast('週末無法申請',true);return;}
  if(isHoliday(date)){showToast(`${holidayName(date)}為國定假日，無法申請`,true);return;}
  if(day===1){showToast('週一不適用居家辦公',true);return;}
  if(isPostHoliday(date)){showToast('連假後第一個工作日，不適用居家辦公',true);return;}
  const half=Math.floor(members.length/2);
  if(applications.filter(a=>a.date===date&&a.status==='approved'&&a.type==='wfh').length>=half){showToast('當日名額已滿',true);return;}
  const ws=new Date(d);ws.setDate(d.getDate()-d.getDay()+1);
  const we=new Date(ws);we.setDate(ws.getDate()+4);
  const hasWeek=applications.some(a=>{if(a.member_id!=memberId||a.status==='rejected'||a.type!=='wfh')return false;const ad=new Date(a.date+'T00:00:00');return ad>=ws&&ad<=we;});
  if(hasWeek){showToast('該成員本週已有居家辦公申請',true);return;}
  // 當週有非公假請假 → 不得申請居家辦公
  // ws=本週一, we=本週五; 休假區間[a.date ~ a.date_end]與本週有任何交集即封鎖
  const hasLeave = applications.some(a => {
    if(a.member_id != memberId) return false;
    if(a.status === 'rejected') return false;
    if(a.type !== 'leave') return false;
    if(a.slot === '公假') return false;          // 公假不限制
    const leaveStart = new Date((a.date || '') + 'T00:00:00');
    const leaveEnd   = new Date((a.date_end || a.date || '') + 'T00:00:00');
    if(isNaN(leaveStart.getTime())) return false;
    // 交集：休假開始 <= 本週五 AND 休假結束 >= 本週一
    return leaveStart <= we && leaveEnd >= ws;
  });
  if(hasLeave){ showToast('該成員當週有請假紀錄（公假除外），本週無法申請居家辦公', true); return; }
  if(applications.find(a=>a.member_id==memberId&&a.date===date&&a.status!=='rejected'&&a.type==='wfh')){showToast('該成員當日已申請',true);return;}
  document.getElementById('submit-btn').disabled=true;
  try {
    const saved=await dbInsert('applications',{member_id:memberId,date,slot:applySlot,status:'pending',type:'wfh',note});
    applications.push(saved);
    await addLog(m.name,'wfh_apply',m.name,date,applySlot,note);
    showToast('居家辦公申請已送出，等待主管審核 ✓');
    document.getElementById('apply-date').value='';
    document.getElementById('apply-note').value='';
    renderQuota('');resetBtn();
  } catch(e){showToast('送出失敗',true);resetBtn();}
}

// ── Calendar ─────────────────────────────────────────────
function prevMonth(){curMonth--;if(curMonth<1){curMonth=12;curYear--;}renderCalendar();}
function nextMonth(){curMonth++;if(curMonth>12){curMonth=1;curYear++;}renderCalendar();}

function renderCalendar() {
  const mN=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('cal-title').textContent=`${curYear} 年 ${mN[curMonth-1]}`;
  const table=document.getElementById('cal-grid');
  const first=new Date(curYear,curMonth-1,1).getDay(); // 0=Sun
  const total=new Date(curYear,curMonth,0).getDate();
  const prevTotal=new Date(curYear,curMonth-1,0).getDate();
  const today=new Date(),todayStr=fmtDate(today.getFullYear(),today.getMonth()+1,today.getDate());

  // Build header row
  let html='<thead><tr>';
  ['日','一','二','三','四','五','六'].forEach(d=>{ html+=`<th>${d}</th>`; });
  html+='</tr></thead><tbody>';

  // Build day cells
  let cells=[];
  // Leading blanks
  for(let i=0;i<first;i++){
    cells.push(`<td><div class="cal-cell other"><div class="day-n">${prevTotal-first+1+i}</div></div></td>`);
  }
  // Current month days
  for(let dd=1;dd<=total;dd++){
    const ds=fmtDate(curYear,curMonth,dd);
    const isToday=ds===todayStr,isMon=isMonday(ds),isWknd=isWeekend(ds);
    const isHol=isHoliday(ds),isMakeup=isMakeupDay(ds),isSel=ds===selectedDate;
    const isPost=isPostHoliday(ds);
    let cls='cal-cell';
    if(isToday)cls+=' today';
    if(isWknd&&!isMakeup)cls+=' wknd';
    if(isSel)cls+=' selected';
    if(isHol&&!isWknd)cls+=' holiday-cell';
    else if(isMakeup)cls+=' makeup-cell';
    else if(isMon&&!isWknd)cls+=' mon-cell';
    let inner=`<div class="day-n">${dd}</div>`;
    if(isHol&&!isWknd) inner+=`<div class="holiday-tag">${holidayName(ds)}</div>`;
    else if(isPost) inner+=`<div class="no-wfh-tag">連假後首日</div>`;
    else if(isMakeup) inner+=`<div class="makeup-tag">補班日</div>`;
    else if(isMon&&!isWknd) inner+=`<div class="no-wfh-tag">週一</div>`;
    // Apps
    const wfhApps=applications.filter(a=>a.date===ds&&a.type==='wfh');
    const leaveApps=applications.filter(a=>a.type==='leave'&&a.status!=='rejected'&&a.date<=ds&&(a.date_end||a.date)>=ds);
    const allApps=[...wfhApps,...leaveApps];
    inner+='<div>';
    allApps.slice(0,2).forEach(a=>{
      const m=getMember(a.member_id);if(!m)return;
      const cc=a.type==='leave'?'chip-leave':a.status==='approved'?'chip-approved':a.status==='rejected'?'chip-rejected':'chip-pending';
      inner+=`<div class="chip ${cc}">${m.name}</div>`;
    });
    if(allApps.length>2) inner+=`<div class="more-hint">+${allApps.length-2}</div>`;
    inner+='</div>';
    const clickable=(!isWknd||isMakeup)?`onclick="selectDay('${ds}')"`:'';
    cells.push(`<td><div class="${cls}" ${clickable}>${inner}</div></td>`);
  }
  // Trailing blanks
  const rem=(7-(first+total)%7)%7;
  for(let d=1;d<=rem;d++){
    cells.push(`<td><div class="cal-cell other"><div class="day-n">${d}</div></div></td>`);
  }
  // Group into rows of 7
  for(let i=0;i<cells.length;i+=7){
    html+='<tr>'+cells.slice(i,i+7).join('')+'</tr>';
  }
  html+='</tbody>';
  table.innerHTML=html;
  if(selectedDate) renderDayDetail(selectedDate);
}
function selectDay(ds){selectedDate=ds;renderCalendar();}

function renderDayDetail(ds) {
  const cont=document.getElementById('day-detail');
  const d=new Date(ds+'T00:00:00');
  const lbl=`${d.getMonth()+1} 月 ${d.getDate()} 日`;
  const wfhApps=applications.filter(a=>a.date===ds&&a.type==='wfh');
  const leaveApps=applications.filter(a=>a.type==='leave'&&a.status!=='rejected'&&a.date<=ds&&(a.date_end||a.date)>=ds);
  const appCount=wfhApps.filter(a=>a.status==='approved').length;
  const half=Math.floor(members.length/2);
  let rows='';
  if(!wfhApps.length&&!leaveApps.length){rows=`<div class="empty-hint">當日無申請紀錄</div>`;}
  else {
    if(leaveApps.length){
      rows+=`<div style="font-size:12px;font-weight:600;color:var(--purple-text);margin-bottom:6px;margin-top:4px">🌴 休假中（${leaveApps.length} 人）</div>`;
      leaveApps.forEach(a=>{
        const m=getMember(a.member_id);if(!m)return;
        const av=getAv(m.id);
        rows+=`<div class="app-row"><div class="app-info"><div class="av" style="background:${av.bg};color:${av.c}">${initials(m.name)}</div><div><div class="app-name">${m.name}</div><div class="app-meta">${m.role}・${a.slot||''}・${a.date}～${a.date_end||a.date}${a.note?'・'+a.note:''}</div></div></div><div class="act-btns"><button class="btn-edit-app" onclick="openEdit(${a.id})">✎ 修改</button><button class="btn-cancel-app" onclick="quickCancel(${a.id})">撤銷</button></div></div>`;
      });
    }
    if(wfhApps.length){
      rows+=`<div style="font-size:12px;font-weight:600;color:var(--blue-text);margin-bottom:6px;margin-top:8px">🏠 居家辦公（${wfhApps.length} 人）</div>`;
      wfhApps.forEach(a=>{
        const m=getMember(a.member_id);if(!m)return;
        const av=getAv(m.id);
        let btns='';
        if(a.status==='pending')btns=`<div class="act-btns"><button class="btn-approve" onclick="approveApp(${a.id})">✓ 核准</button><button class="btn-reject-open" onclick="openReject(${a.id})">✕ 拒絕</button><button class="btn-edit-app" onclick="openEdit(${a.id})">✎</button><button class="btn-cancel-app" onclick="quickCancel(${a.id})">撤銷</button></div>`;
        else if(a.status==='approved')btns=`<div class="act-btns"><span class="status-pill chip-approved">已核准</span><button class="btn-edit-app" onclick="openEdit(${a.id})">✎</button><button class="btn-cancel-app" onclick="quickCancel(${a.id})">撤銷</button></div>`;
        else btns=`<div><span class="status-pill chip-rejected">已拒絕</span>${a.reject_reason?`<div class="app-reject-reason">原因：${a.reject_reason}</div>`:''}</div>`;
        rows+=`<div class="app-row"><div class="app-info"><div class="av" style="background:${av.bg};color:${av.c}">${initials(m.name)}</div><div><div class="app-name">${m.name}</div><div class="app-meta">${m.role}・${a.slot}${a.note?'・'+a.note:''}</div></div></div>${btns}</div>`;
      });
    }
  }
  cont.innerHTML=`<div class="card day-detail-card"><div class="detail-header"><div class="detail-title">${lbl} 申請列表</div><div class="detail-quota">WFH ${appCount}/${half} 人已核准</div></div>${rows}</div>`;
}

// ── Approve / Reject ─────────────────────────────────────
async function approveApp(id) {
  const a=applications.find(x=>x.id==id);if(!a)return;
  const half=Math.floor(members.length/2);
  if(applications.filter(x=>x.date===a.date&&x.status==='approved'&&x.type==='wfh').length>=half){showToast('當日核准人數已達上限',true);return;}
  const m=getMember(a.member_id);
  try{await dbUpdate('applications',id,{status:'approved'});a.status='approved';await addLog('主管','approve',m?m.name:'',a.date,a.slot,'');renderCalendar();showToast('已核准申請 ✓');}
  catch{showToast('操作失敗',true);}
}

function openReject(id) {
  document.getElementById('reject-app-id').value=id;
  document.getElementById('reject-reason').value='';
  document.getElementById('reject-modal').style.display='flex';
}
function closeRejectModal(){document.getElementById('reject-modal').style.display='none';}
async function confirmReject() {
  const id=parseInt(document.getElementById('reject-app-id').value);
  const reason=document.getElementById('reject-reason').value.trim();
  if(!reason){showToast('請填寫拒絕原因',true);return;}
  const a=applications.find(x=>x.id==id);if(!a)return;
  const m=getMember(a.member_id);
  try{
    await dbUpdate('applications',id,{status:'rejected',reject_reason:reason});
    a.status='rejected';a.reject_reason=reason;
    await addLog('主管','reject',m?m.name:'',a.date,a.slot,reason);
    closeRejectModal();renderCalendar();showToast('已拒絕申請');
  }catch{showToast('操作失敗',true);}
}

function selEditSlot(el,slot){editSlot=slot;document.querySelectorAll('#edit-seg .seg-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');}
function closeEditModal(){document.getElementById('edit-modal').style.display='none';}

async function saveEdit() {
  const id=parseInt(document.getElementById('edit-app-id').value);
  const type=document.getElementById('edit-app-type').value;
  const note=document.getElementById('edit-note').value.trim();
  const a=applications.find(x=>x.id==id);if(!a)return;
  const m=getMember(a.member_id);
  if(type==='leave'){
    const start=document.getElementById('edit-leave-start').value;
    const end=document.getElementById('edit-leave-end').value;
    const lt=document.getElementById('edit-leave-type').value;
    if(!start||!end){showToast('請選擇起訖日期',true);return;}
    if(end<start){showToast('結束日期不可早於開始日期',true);return;}
    try{
      await dbUpdate('applications',id,{date:start,date_end:end,slot:lt,note});
      a.date=start;a.date_end=end;a.slot=lt;a.note=note;
      await addLog(m?m.name:'主管','edit',m?m.name:'',`${start}～${end}`,lt,'修改休假申請');
      closeEditModal();renderCalendar();showToast('已修改 ✓');
    }catch{showToast('修改失敗',true);}
  } else {
    const date=document.getElementById('edit-date').value;
    if(!date){showToast('請選擇日期',true);return;}
    const d=new Date(date+'T00:00:00'),day=d.getDay();
    if((day===0||day===6)&&!isMakeupDay(date)){showToast('週末無法申請',true);return;}
    if(isHoliday(date)){showToast('國定假日不適用',true);return;}
    if(day===1){showToast('週一不適用',true);return;}
    try{
      await dbUpdate('applications',id,{date,slot:editSlot,note});
      a.date=date;a.slot=editSlot;a.note=note;
      await addLog(m?m.name:'主管','edit',m?m.name:'',date,editSlot,'修改居家辦公申請');
      closeEditModal();renderCalendar();renderQuota(document.getElementById('apply-date').value||'');showToast('已修改 ✓');
    }catch{showToast('修改失敗',true);}
  }
}

async function quickCancel(id) {
  const a=applications.find(x=>x.id==id);if(!a)return;
  const m=getMember(a.member_id);
  if(!confirm('確定要撤銷這筆申請？'))return;
  try{
    await dbDelete('applications',id);
    applications=applications.filter(x=>x.id!=id);
    await addLog(m?m.name:'主管','cancel',m?m.name:'',a.date,a.slot||'','撤銷申請');
    renderCalendar();renderQuota(document.getElementById('apply-date').value||'');showToast('已撤銷');
  }catch{showToast('操作失敗',true);}
}
async function cancelApp() {
  const id=parseInt(document.getElementById('edit-app-id').value);
  await quickCancel(id);
  closeEditModal();
}

// ── Members ──────────────────────────────────────────────
function renderMembers() {
  const mg=document.getElementById('member-grid');
  mg.innerHTML=members.map(m=>{
    const av=getAv(m.id);
    return `<div class="member-card">
      <div class="av" style="background:${av.bg};color:${av.c};width:38px;height:38px;font-size:13px">${initials(m.name)}</div>
      <div style="flex:1;min-width:0"><div class="m-name">${m.name}</div><div class="m-role">${m.role||''}</div></div>
      <div class="member-card-actions">
        <button class="mc-btn edit-btn" onclick="openMemberEdit(${m.id})" title="編輯">✎</button>
        <button class="mc-btn del-btn" onclick="deleteMember(${m.id})" title="刪除">×</button>
      </div>
    </div>`;
  }).join('');
  const pending=applications.filter(a=>a.status==='pending').length;
  const pad=n=>String(n).padStart(2,'0');
  const thisMonthApproved=applications.filter(a=>a.date&&a.date.startsWith(`${curYear}-${pad(curMonth)}`)&&a.status==='approved').length;
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="stat-num">${members.length}</div><div class="stat-lbl">部門成員</div></div>
    <div class="stat-card"><div class="stat-num">${pending}</div><div class="stat-lbl">待審核申請</div></div>
    <div class="stat-card"><div class="stat-num">${thisMonthApproved}</div><div class="stat-lbl">本月已核准天次</div></div>`;
}

function openMemberEdit(id) {
  const m=getMember(id);if(!m)return;
  document.getElementById('edit-member-id').value=id;
  document.getElementById('edit-member-name').value=m.name;
  document.getElementById('edit-member-role').value=m.role||'';
  document.getElementById('member-modal').style.display='flex';
}
function closeMemberModal(){document.getElementById('member-modal').style.display='none';}
async function saveMemberEdit() {
  const id=parseInt(document.getElementById('edit-member-id').value);
  const name=document.getElementById('edit-member-name').value.trim();
  const role=document.getElementById('edit-member-role').value.trim();
  if(!name){showToast('請輸入姓名',true);return;}
  const m=getMember(id);if(!m)return;
  const oldName=m.name;
  try{
    await dbUpdate('members',id,{name,role});
    m.name=name;m.role=role;
    await addLog('主管','member_edit',name,'','',`${oldName} → ${name}，職稱：${role}`);
    closeMemberModal();renderMembers();renderApplySelect();showToast(`已更新 ${name} ✓`);
  }catch{showToast('更新失敗',true);}
}
async function addMember() {
  const name=document.getElementById('new-name').value.trim();
  const role=document.getElementById('new-role').value.trim();
  if(!name){showToast('請輸入姓名',true);return;}
  try{
    const saved=await dbInsert('members',{name,role:role||'行銷企劃'});
    members.push(saved);
    await addLog('主管','member_add',name,'','','新增成員');
    document.getElementById('new-name').value='';document.getElementById('new-role').value='';
    renderMembers();renderApplySelect();showToast(`已新增 ${name} ✓`);
  }catch{showToast('新增失敗',true);}
}
async function deleteMember(id) {
  if(members.length<=1){showToast('至少保留一位成員',true);return;}
  const m=getMember(id);if(!m)return;
  if(!confirm(`確定要移除「${m.name}」？\n⚠️ 該成員的申請紀錄將保留，但顯示為「已刪除成員」`))return;
  try{
    await dbDelete('members',id);
    members=members.filter(x=>x.id!=id);
    await addLog('主管','member_del',m.name,'','','移除成員');
    renderMembers();renderCalendar();renderApplySelect();showToast(`已移除 ${m.name}`);
  }catch{showToast('移除失敗',true);}
}

// ── Log ──────────────────────────────────────────────────
function updateLogFilters() {
  const sel=document.getElementById('lf-member');
  const cur=sel.value;
  const names=[...new Set(logs.map(l=>l.target).filter(Boolean))].sort();
  sel.innerHTML=`<option value="">全部成員</option>`+names.map(n=>`<option value="${n}" ${n===cur?'selected':''}>${n}</option>`).join('');
}
function renderLog() {
  const fa=document.getElementById('lf-action').value;
  const fm=document.getElementById('lf-member').value;
  const fs=document.getElementById('lf-search').value.trim().toLowerCase();
  const aLabel={wfh_apply:'申請居家',leave_apply:'申請休假',approve:'核准',reject:'拒絕',edit:'修改',cancel:'撤銷',member_add:'新增成員',member_edit:'編輯成員',member_del:'移除成員'};
  const aClass={wfh_apply:'lb-apply',leave_apply:'lb-leave',approve:'lb-approve',reject:'lb-reject',edit:'lb-edit',cancel:'lb-cancel',member_add:'lb-madd',member_edit:'lb-medit',member_del:'lb-mdel'};
  const filtered=logs.filter(l=>{
    if(fa&&l.action!==fa)return false;
    if(fm&&l.target!==fm)return false;
    if(fs&&!(l.actor+l.target+l.date+l.note+l.slot).toLowerCase().includes(fs))return false;
    return true;
  });
  document.getElementById('log-count').textContent=`共 ${filtered.length} 筆記錄`;
  const tbody=document.getElementById('log-body');
  if(!filtered.length){tbody.innerHTML=`<tr><td colspan="7"><div class="empty-hint">沒有符合條件的記錄</div></td></tr>`;return;}
  tbody.innerHTML=filtered.map((l,i)=>`<tr class="${i===0?'log-new':''}">
    <td style="color:var(--text3);font-size:12px;white-space:nowrap">${l.ts}</td>
    <td style="white-space:nowrap">${l.actor}</td>
    <td><span class="log-badge ${aClass[l.action]||'lb-cancel'}">${aLabel[l.action]||l.action}</span></td>
    <td style="white-space:nowrap">${l.target||'—'}</td>
    <td style="color:var(--text3);white-space:nowrap">${l.date||'—'}</td>
    <td style="color:var(--text3);white-space:nowrap">${l.slot||'—'}</td>
    <td style="color:var(--text3)">${l.note||'—'}</td>
  </tr>`).join('');
}
function exportLog() {
  const rows=[['時間','操作人','動作','對象','日期','時段／假別','備註／原因'],...logs.map(l=>[l.ts,l.actor,l.action,l.target,l.date,l.slot,l.note])];
  const csv=rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='混合辦公操作記錄.csv';a.click();URL.revokeObjectURL(url);
  showToast('已匯出 CSV ✓');
}
async function clearLog() {
  if(!confirm('確定要清除所有操作記錄？此動作無法還原。'))return;
  try{await supabase_client.from('logs').delete().neq('id',0);logs=[];renderLog();showToast('操作記錄已清除');}
  catch{showToast('清除失敗',true);}
}

// ── Toast ─────────────────────────────────────────────────
let toastTimer;
function showToast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(err?' err':'');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',2800);
}

// ── Start ─────────────────────────────────────────────────
init();
</script>
</body>
</html>
